<!doctype html>
<!-- BORRADOR — el botón de abajo debe ser el enlace de INVITACIÓN AL GRUPO
     de WhatsApp (un clic = dentro del grupo), no un chat individual. El
     cliente va a pasar ese enlace — hasta entonces queda en placeholder,
     no se inventa uno que parezca real. -->
<html lang="es" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />

    <title>¡Listo! · Plan de Edición Total</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fuentes/special-gothic-expanded-one.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#0B0908" />

    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>

    <main id="contenido" tabindex="-1">
      <section class="seccion pt-[var(--spacing-xl)]">
        <div class="contenedor max-w-[36rem] text-center" data-motion="reveal">
          <h1 class="font-display text-[2rem] leading-[1.1] uppercase md:text-[2.75rem]">Tu cupo quedó agendado</h1>

          <p class="prosa mx-auto mt-[var(--spacing-md)] max-w-[30rem] text-lg text-[var(--texto-secundario)]">
            Un último paso: únete a nuestro grupo de WhatsApp VIP con un solo clic. Es el único medio de acceso a la
            clase en vivo del lunes.
          </p>

          <div class="mt-[var(--spacing-lg)]">
            <a
              href="https://[ENLACE_GRUPO_WHATSAPP_PENDIENTE]"
              target="_blank"
              rel="noopener noreferrer"
              class="boton boton-primario"
            >
              Unirme al grupo VIP
            </a>
          </div>

          <p class="mt-[var(--spacing-sm)] text-sm text-[var(--texto-secundario)]">
            Lunes · 6:00 p. m. · Te esperamos ahí.
          </p>
        </div>
      </section>
    </main>

    <footer class="border-t border-[var(--linea)] py-[var(--spacing-xl)]">
      <p class="contenedor text-center text-sm text-[var(--texto-secundario)]">
        © <span data-ano>2026</span> Plan de Edición Total. Todos los derechos reservados.
      </p>
    </footer>
  </body>
</html>
